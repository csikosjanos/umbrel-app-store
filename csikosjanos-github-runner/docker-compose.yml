version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: csikosjanos-github-runner_runner_1
      APP_PORT: 8080
      # PROXY_AUTH_ADD is deliberately not set: the default (on) means the UI
      # needs an Umbrel login, which matters because it manages runner tokens.

  # One container runs the web UI and every runner (one process per runner,
  # each as its own unprivileged uid). No docker.sock. See README.
  runner:
    image: ghcr.io/csikosjanos/github-runner-manager:2.0.0
    restart: unless-stopped
    # Give runners time to finish deregistering/stopping on app stop.
    stop_grace_period: 1m
    volumes:
      # Runner config + tokens (secrets/<id>.pat, 0600, root only).
      - ${APP_DATA_DIR}/data:/data
      # Read-only, only for the one-time import of the 1.x app-data/.env
      # (ORG_NAME / ACCESS_TOKEN) as runner #1.
      - ${APP_DATA_DIR}:/legacy:ro
    security_opt:
      - no-new-privileges:true
