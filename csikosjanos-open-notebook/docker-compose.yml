version: "3.8"

services:
  app_proxy:
    environment:
      APP_HOST: csikosjanos-open-notebook_open_notebook_1
      APP_PORT: 8502
      PROXY_AUTH_ADD: "false"

  surrealdb:
    image: surrealdb/surrealdb:v2
    command:
      - start
      - --log
      - info
      - --user
      - ${SURREAL_USER:-root}
      - --pass
      - ${SURREAL_PASSWORD:-root}
      - rocksdb:/mydata/mydatabase.db
    user: root
    # localhost-only: DB is internal, never exposed on the tailnet/LAN
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${APP_DATA_DIR}/data/surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: on-failure

  open_notebook:
    image: lfnovo/open_notebook:v1-latest
    # NOTE: do NOT publish 8502 here — Umbrel's app_proxy already binds host
    # 8502 (manifest `port`) and proxies to this container over the internal
    # network. Publishing it again collides ("port is already allocated") and
    # the container stays in Created. app_proxy only proxies that one port, so
    # the REST API (5055) is published directly for LAN/tailnet access.
    ports:
      - "5055:5055"
    environment:
      # REQUIRED for the Web UI to reach its API. open-notebook's browser
      # frontend calls the API directly, so it must know the app's PUBLIC URL
      # (Next.js forwards /api/* to the backend internally — one port only, no
      # /api suffix here). Left unset the notebooks page shows "Unable to
      # Connect to API Server". Set API_URL in app-data/.env to the URL you
      # actually open the app on, e.g. your Tailscale-serve URL:
      #   API_URL=https://<host>.ts.net:18502
      # See this app's README for the exact steps.
      - API_URL=${API_URL:-}
      # Injected post-install via app-data/.env (never committed). Must be
      # stable — rotating it orphans provider API keys stored in the UI.
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY:-change-me-to-a-secret-string}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASSWORD=${SURREAL_PASSWORD:-root}
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
    volumes:
      - ${APP_DATA_DIR}/data/notebook_data:/app/data
    depends_on:
      - surrealdb
    restart: on-failure
