category: ai
version: "1.1.0"
port: 4123
description: >-
  Qwen3-TTS is Alibaba Cloud's open-source text-to-speech model. This app runs
  the community `cornball-ai/qwen3-tts-api` server in **API-only mode** — a
  FastAPI/uvicorn REST API on port 4123 with an **OpenAI-compatible**
  `/v1/audio/speech` endpoint (plus `/v1/voices`, and voice-clone / voice-design
  endpoints). There is no web UI; call it from a CLI or any OpenAI-compatible
  client.


  It uses the 1.7B **CustomVoice** model (9 built-in speakers). On first start it
  downloads the model from Hugging Face (~7 GB) into the app's cache, so the
  initial boot is slow. Health is reported at `/health` on 4123.


  IMPORTANT — VRAM: the model needs ~8 GB of VRAM, which is your whole card, so
  it CANNOT run at the same time as Ollama (or any other GPU app). Stop the
  other GPU app first, then start this one. Voice cloning / voice design need
  even more VRAM (12–16 GB) and may not be usable on an 8 GB card.


  NOTE: Gradio has been removed — this app is API-only.
developer: Alibaba Qwen (model), cornball-ai (server), packaged by csikosjanos
