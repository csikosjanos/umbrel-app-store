description: >-
  YuE2 is an open music model from M-A-P that writes an editable score
  (melody and chords in ABC notation) and then renders a full song with
  vocals and accompaniment in 48 kHz stereo. It can also cover an existing
  recording in a new style with new lyrics.


  This app runs yue2.cpp, a C++/GGML port of YuE2, with quantized GGUF
  weights so it fits an 8 GB GPU. The browser UI writes style tags and
  lyrics, shows the score the model composed, plays and downloads tracks.
  The same server exposes a job API (POST /synth, GET /job) for scripts.


  Needs an NVIDIA GPU. On first start it downloads about 5.4 GB of weights
  from Hugging Face, so the first boot is slow. The model shares the GPU
  with other apps (e.g. Ollama); free VRAM before generating.


  Model weights are CC BY-NC 4.0: non-commercial use only.
